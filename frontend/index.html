<!-- SSO Token -->
<script defer>

    (async () => {
        if (localStorage.getItem('userToken')) return;
        
        try {
            const res = await fetch('https://edu.roginx.ink/api/auth-center/sso-config', {
                credentials: 'include'
            });
            const data = await res.json();
            console.log('SSO响应数据:', data);
            
            if (data.code === 200 && data.data?.data?.cookies) {
                const { sso_access_token, sso_refresh_token } = data.data.data.cookies;
                console.log('提取的tokens:', { sso_access_token: sso_access_token?.substring(0, 20) + '...', sso_refresh_token });
                
                if (sso_access_token && sso_refresh_token) {
                    localStorage.setItem('userToken', sso_access_token);
                    localStorage.setItem('auth_token', sso_access_token);
                    localStorage.setItem('freshToken', sso_refresh_token);
                    localStorage.setItem('fresh_token', sso_refresh_token);
                    console.log('Token已存储到localStorage');
                    
                    // 触发自定义事件通知应用获取用户信息
                    window.dispatchEvent(new CustomEvent('ssoTokenUpdated'));
                }
            }
        } catch (e) {
            console.warn('SSO token fetch failed:', e);
        }
    })();
</script>
