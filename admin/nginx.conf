# 子应用Nginx配置示例
# 将此配置添加到您的Nginx服务器中

# 子应用配置
location /admin/ {
    # 直接代理到COS存储桶
    proxy_pass https://cos.roginx.ink/www/admin/;
    
    # 添加必要的CORS头
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    
    # 如果是OPTIONS请求，直接返回200
    if ($request_method = 'OPTIONS') {
        return 200;
    }
}

# 确保子应用的index.html可以被正确访问
location = /admin {
    # 直接代理子应用的index.html
    proxy_pass https://cos.roginx.ink/www/admin/index.html;
    
    # 添加必要的CORS头
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
}

# 确保qiankun-entry.js可以被正确访问
location = /admin/assets/js/qiankun-entry.js {
    # 直接代理到qiankun入口文件
    proxy_pass https://cos.roginx.ink/www/admin/assets/js/qiankun-entry.js;
    
    # 添加必要的CORS头
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
} 